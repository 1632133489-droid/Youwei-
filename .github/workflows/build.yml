name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (no signing)
        run: |
          xcodebuild \
            -project DeepSeekChat.xcodeproj \
            -scheme DeepSeekChat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/DeepSeekChat.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/DeepSeekChat.xcarchive/Products/Applications/DeepSeekChat.app" Payload/
          zip -r DeepSeekChat-unsigned.ipa Payload
          ls -lh DeepSeekChat-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekChat-unsigned-ipa
          path: DeepSeekChat-unsigned.ipa
          retention-days: 30
